[workspace]
exclude = [
  "crates/.claude",
  "vendor/bevy_render",
  "vendor/bevy_winit",
  "vendor/clay-layout",
  "vendor/wesl",
]
members  = [
  "crates/fairy_dust",
  "crates/hana_clerestory",
  "crates/hana_diegetic",
  "crates/hana_kana",
  "crates/hana_lading",
  "crates/hana_lagrange",
  "crates/hana_liminal",
  "crates/hana_metrics",
  "crates/hana_rigging",
  "crates/hana_rigging_scripted",
  "crates/hana_rubric",
  "crates/hana_shader_testing",
  "crates/hana_valence",
]
resolver = "3"

[workspace.package]
authors    = ["natepiano"]
categories = ["game-engines", "graphics", "visualization"]
edition    = "2024"
keywords   = ["bevy", "dcc", "visualization"]
license    = "MIT OR Apache-2.0"
readme     = "README.md"
repository = "https://github.com/natepiano/bevy_hana"
version    = "0.1.0"

[workspace.dependencies]
#
# Workspace member crates
#
fairy_dust            = { path = "crates/fairy_dust" }
hana_clerestory       = { path = "crates/hana_clerestory" }
hana_diegetic         = { path = "crates/hana_diegetic" }
hana_kana             = { path = "crates/hana_kana" }
hana_lading           = { path = "crates/hana_lading" }
hana_lagrange         = { path = "crates/hana_lagrange", features = ["fit_overlay"] }
hana_liminal          = { path = "crates/hana_liminal" }
hana_metrics          = { path = "crates/hana_metrics" }
hana_rigging          = { path = "crates/hana_rigging" }
hana_rigging_scripted = { path = "crates/hana_rigging_scripted" }
hana_rubric           = { path = "crates/hana_rubric" }
hana_shader_testing   = { path = "crates/hana_shader_testing" }
hana_valence          = { path = "crates/hana_valence", default-features = false }

#
# External dependencies
#
anyhow = "1.0.104"
bevy = { version = "0.20.0", default-features = false, features = [
  "3d",
  "bevy_dev_tools",
  "bevy_remote",
  "bevy_ui_render",
  "bevy_ui_widgets",
  "default_font",
  "gif",
  "jpeg",
  "png",
  "reflect_auto_register",
  "serialize",
  # SMAA's lookup textures. Enabled transitively today because several
  # dependencies take bevy's default features; named here so the outline
  # examples keep real anti-aliasing instead of silently falling back to
  # bevy's placeholder LUT if one of them ever tightens that.
  "smaa_luts",
  "track_location",
  "webp",
] }
bevy-inspector-egui = "0.38.0"
bevy_app = { version = "0.20.0", features = ["reflect_auto_register", "std"] }
bevy_asset = "0.20.0"
bevy_camera = "0.20.0"
bevy_color = { version = "0.20.0", features = ["bevy_reflect"] }
bevy_curve = "0.20.0"
bevy_diagnostic = "0.20.0"
bevy_ecs = { version = "0.20.0", features = [
  "bevy_reflect",
  "reflect_auto_register",
  "std",
] }
bevy_enhanced_input = { version = "0.27.2", features = ["reflect"] }
bevy_log = "0.20.0"
bevy_lookup_curve = { version = "0.13.0", default-features = false, features = [
  "bevy_asset",
  "bevy_reflect",
] }
bevy_math = { version = "0.20.0", features = ["bevy_reflect", "std"] }
bevy_platform = { version = "0.20.0", default-features = false, features = [
  "std",
] }
bevy_reflect = { version = "0.20.0", features = ["glam"] }
bevy_remote = "0.20.0"
bevy_render = "0.20.0"
bevy_scene = "0.20.0"
bevy_state = "0.20.0"
bevy_time = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_transform = { version = "0.20.0", features = ["std"] }
bevy_tween = { version = "0.14.1", default-features = false }
bitflags = "2"
blake3 = "1.8.7"
block2 = "0.6.2"
bytemuck = "1"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
# nokhwa-bindings-macos takes a flume 0.11 `Sender` in its public API; keep this in step with it.
flume = "0.11"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
glam = { version = "0.33.9", features = ["serde"] }
hound = "3.5.1"
image = { version = "0.25", default-features = false }
indexmap = "=2.14.0"
moonshine-save = "0.8.0"
moonshine-util = "0.6.0"
nokhwa = { version = "0.10.11", default-features = false, features = [
  "input-native",
  "output-threaded",
] }
nokhwa-bindings-macos = "0.2.4"
nonmax = "0.5"
notify = "8"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
  "AVCaptureDevice",
  "AVMediaFormat",
  "block2",
  "objc2-core-media",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "CFUUID",
  "std",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "CMFormatDescription",
  "CMTime",
  "objc2",
] }
objc2-foundation = "0.3.2"
opener = { version = "0.8.5", features = ["reveal"] }
owned_ttf_parser = "0.25.1"
parley = { version = "0.9.0", default-features = false, features = ["std"] }
pipewire = "0.10.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
raw-window-handle = "0.6"
ron = "0.12.2"
schemars = "1.2.2"
screencapturekit = "10.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json_lenient = "0.2"
smallvec = "1"
speech = "0.8.7"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "3.0.6", features = ["full"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = { version = "0.1", default-features = false, features = ["std"] }
ttf-parser = "0.25"
ureq = "3.4"
v4l = "0.14.0"
windows = "0.62.2"
windows-core = "0.62.2"
# Pinned to the exact winit that bevy 0.20 resolves so `MonitorHandle` unifies to
# one crate instance; used only for per-platform native monitor ids.
winit = { version = "0.30.13", default-features = false, features = [
  "wayland",
  "x11",
] }
x11rb = { version = "0.13", default-features = false }
xcap = "0.9.8"
zbus = "5.19.0"

# dev-dependencies
bevy_brp_extras   = "0.23.0"
clay-layout       = { path = "vendor/clay-layout" }
criterion         = { version = "0.8.2", features = ["html_reports"] }
float-cmp         = "0.10.0"
jsonschema        = { version = "0.57.0", default-features = false }
naga              = { version = "30.0.1", features = ["wgsl-in", "wgsl-out"] }
serde_json        = "1.0.151"
static_assertions = "1.1.0"
tempfile          = "3.27.0"
wgpu              = "30"

[workspace.lints.clippy]
# Our strict lints
allow_attributes_without_reason = "deny"
expect_used                     = "deny"
panic                           = "deny"
self_named_module_files         = "deny" # use module/mod.rs (directory form) when a module has submodules
unreachable                     = "deny"
unwrap_used                     = "deny"

# Enable lint groups as errors (with lower priority so allows can override)
all      = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Universal allows
multiple_crate_versions = "allow"
redundant_feature_names = "allow" # `bench_support` names a private benchmark support surface.
redundant_pub_crate     = "allow" # cargo mend is the visibility authority, not clippy

# Allow specific lints that conflict with Bevy patterns
needless_pass_by_value = "allow" # Bevy systems require owned params
option_if_let_else     = "allow" # False positives with Bevy reflect macros
too_many_arguments     = "allow" # Bevy systems often require many params
type_complexity        = "allow" # Bevy query types are inherently complex
wildcard_imports       = "allow" # Bevy prelude convention

[workspace.lints.rust]
missing_docs = "deny"

# Features verify.sh adds to its dev and test cargo calls (check, test, final, doc, and build
# without --release). Bevy as one shared library, measured 2026-10-28 through plain verify.sh
# under a build hold: a main.rs edit rebuilds 17% faster, a library edit 27% faster, and the
# full test step 107 s (9%) faster. The first build after the switch takes about 4.6 min, once
# per worktree.
[workspace.metadata.dev]
features = ["hana/dynamic_linking"]

# Symbols, file:line and inline frames for perf, addr2line and panic backtraces;
# the type and variable records full debug info adds are not used.
[profile.release]
debug = "line-tables-only"

# Link time, not binary size, is what iteration pays here: ~18 integration-test
# binaries each statically link the whole engine. `line-tables-only` keeps panic
# backtraces pointing at file:line while dropping the type and variable records
# the linker would otherwise have to merge, and `unpacked` leaves debug info in
# the .o files instead of copying it into every binary.
[profile.dev]
debug           = "line-tables-only"
split-debuginfo = "unpacked"

# Optimize dependencies even in dev builds; keeps own-crate incremental compiles fast.
[profile.dev.package."*"]
opt-level = 3
# Incremental ThinLTO reused stale objects in the vendored path crates and left undefined symbols.
incremental = false

# Cable routing searches thousands of grid cells per cable; unoptimised it runs about 20x slower,
# so cables take seconds to settle after Open in a dev build.
[profile.dev.package.hana_conduit]
opt-level = 3

# Every other workspace crate except `hana` builds at opt-level 1. Measured 2026-10-28 through
# plain verify.sh under a build hold: the test step ran about 33% faster (530 / 480 s against
# 333 / 341 s), the hana rebuild after an edit was a tie (32.8 / 32.2 s), and a cold build of
# these crates cost 32 s more (116.9 / 149.0 s). `hana` stays at 0 because its rebuild is the
# edit loop. One block per crate, not `[profile.dev]`: only a package block overrides
# `build-override` for the proc-macro `hana_tool_macros`.
[profile.dev.package.fairy_dust]
opt-level = 1

[profile.dev.package.hana_animation]
opt-level = 1

[profile.dev.package.hana_catalyst]
opt-level = 1

[profile.dev.package.hana_clerestory]
opt-level = 1

[profile.dev.package.hana_diegetic]
opt-level = 1

[profile.dev.package.hana_effects]
opt-level = 1

[profile.dev.package.hana_kana]
opt-level = 1

[profile.dev.package.hana_lading]
opt-level = 1

[profile.dev.package.hana_lagrange]
opt-level = 1

[profile.dev.package.hana_liminal]
opt-level = 1

[profile.dev.package.hana_metrics]
opt-level = 1

[profile.dev.package.hana_mimesis_tools]
opt-level = 1

[profile.dev.package.hana_organon]
opt-level = 1

[profile.dev.package.hana_origami]
opt-level = 1

[profile.dev.package.hana_prosody]
opt-level = 1

[profile.dev.package.hana_rigging]
opt-level = 1

[profile.dev.package.hana_rigging_scripted]
opt-level = 1

[profile.dev.package.hana_rubric]
opt-level = 1

[profile.dev.package.hana_sdf]
opt-level = 1

[profile.dev.package.hana_tool_macros]
opt-level = 1

[profile.dev.package.hana_tool_schema]
opt-level = 1

[profile.dev.package.hana_tools]
opt-level = 1

[profile.dev.package.hana_valence]
opt-level = 1

[profile.dev.package.hana_video]
opt-level = 1

[profile.dev.package.hana_works]
