[package]
authors.workspace = true
categories        = ["game-development", "hardware-support"]
description       = "Device identity, presence, availability, and recovery policy for Bevy providers"
edition.workspace = true
exclude           = ["examples/identity_decision.rs", "tests/"]
homepage          = "https://github.com/natepiano/bevy_hana/tree/main/crates/hana_rigging"
keywords          = ["bevy", "device", "hardware", "identity", "recovery"]
license.workspace = true
name              = "hana_rigging"
readme            = "README.md"
repository        = "https://github.com/natepiano/bevy_hana"
version           = "0.1.0"

[lints]
workspace = true

[dependencies]
bevy                = { workspace = true, features = ["bevy_log", "multi_threaded"] }
serde.workspace     = true
thiserror.workspace = true

[dev-dependencies]
bevy                            = { workspace = true, features = ["bevy_world_serialization"] }
fairy_dust.workspace            = true
hana_diegetic.workspace         = true
hana_lagrange.workspace         = true
hana_rigging_scripted.workspace = true
ron.workspace                   = true
trybuild.workspace              = true
