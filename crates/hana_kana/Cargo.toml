[package]
authors.workspace = true
categories        = ["game-development", "game-engines"]
description       = "Ergonomic, opinionated utilities for Bevy — type-safe math and cascade values"
edition.workspace = true
exclude           = ["examples/cascade.rs"]
homepage          = "https://github.com/natepiano/bevy_hana/tree/main/crates/hana_kana"
keywords          = ["bevy", "ecs", "gamedev", "math"]
license.workspace = true
name              = "hana_kana"
readme            = "README.md"
repository        = "https://github.com/natepiano/bevy_hana"
version           = "0.5.0-dev"

[lints]
workspace = true

[features]
default = ["math"]
math    = []
tween   = ["dep:bevy_tween"]

[dependencies]
bevy              = { workspace = true, features = ["bevy_asset", "bevy_log"] }
bevy_lookup_curve = { workspace = true }
bevy_tween        = { workspace = true, optional = true }
thiserror         = { workspace = true }

[dev-dependencies]
bevy          = { workspace = true, features = ["3d"] }
bevy_tween    = { workspace = true }
fairy_dust    = { workspace = true }
hana_diegetic = { workspace = true }
hana_lagrange = { workspace = true }
