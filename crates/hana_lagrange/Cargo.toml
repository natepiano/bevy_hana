[package]
authors.workspace = true
categories        = ["game-development"]
description       = "Bevy camera controller with pan, orbit, zoom-to-fit, retained camera journeys, and trackpad support"
edition.workspace = true
homepage          = "https://github.com/natepiano/bevy_hana/tree/main/crates/hana_lagrange"
keywords          = ["bevy", "camera", "gamedev", "orbit"]
license.workspace = true
name              = "hana_lagrange"
readme            = "README.md"
repository        = "https://github.com/natepiano/bevy_hana"
version           = "0.6.0-dev"

[lints]
workspace = true

[features]
default = []
fit_overlay = [
  "bevy/bevy_asset",
  "bevy/bevy_mesh",
  "bevy/bevy_pbr",
  "bevy/bevy_picking",
  "bevy/bevy_text",
  "bevy/bevy_ui",
  "bevy/bevy_ui_render",
]

[dependencies]
bevy = { workspace = true, features = [
  "bevy_asset",
  "bevy_camera",
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_window",
] }
bevy_enhanced_input = { workspace = true }
bitflags = { workspace = true }
hana_kana = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bevy            = { workspace = true, features = ["3d"] }
bevy_brp_extras = { workspace = true }
fairy_dust      = { workspace = true }
float-cmp       = { workspace = true }
hana_clerestory = { workspace = true }
hana_diegetic   = { workspace = true }
hana_rubric     = { workspace = true }

[[example]]
name              = "showcase"
required-features = ["fit_overlay"]

[[example]]
name = "zoom_to_fit"

[[example]]
name = "animation"
