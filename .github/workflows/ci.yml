# Generated. Do not edit here.
#
# CI builds examples and compiles tests against their real dev-dependencies.
# GitHub-hosted runners have no GPU. Hana CI runs these tests on a GPU
# from the same source.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (examples and tests included)
    runs-on: ubuntu-latest
    # The Bevy 0.20 test build filled the runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build workspace and examples
        run: cargo build --workspace --all-features --examples

      - name: Compile tests
        run: cargo test --workspace --all-features --no-run
