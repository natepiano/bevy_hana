# Generated. Do not edit here.
#
# This CI must build examples: proving the published crates' examples compile
# against real dev-dependencies is the entire reason this tree exists. A
# generator bug that ships an incomplete closure fails here and nowhere else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (examples included)
    runs-on: ubuntu-latest
    # The Bevy 0.20 test build filled the runner's disk.
    env: &ci-build-env
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - &free-runner-disk
        name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build workspace and examples
        run: cargo build --workspace --all-features --examples

  test:
    name: Test
    runs-on: ubuntu-latest
    env: *ci-build-env
    steps:
      - uses: actions/checkout@v4
      - *free-runner-disk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      # The nested lock uses private vendor patches; the mirror resolves those entries again here.
      - name: Warm the external-client cache for its nested offline build
        run: >-
          cargo fetch
          --manifest-path crates/hana_rigging/tests/external_client/Cargo.toml
      - name: Run tests
        run: cargo nextest run --workspace --all-features
