# Generated. Do not edit here.
#
# This CI must build examples: proving the published crates' examples compile
# against real dev-dependencies is the entire reason this tree exists. A
# generator bug that ships an incomplete closure fails here and nowhere else.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (examples included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Build workspace and examples
        run: cargo build --workspace --all-features --examples

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Warm the external-client cache for its nested offline build
        run: >-
          cargo fetch
          --manifest-path crates/hana_rigging/tests/external_client/Cargo.toml
          --locked
      - name: Run tests
        run: cargo nextest run --workspace --all-features
